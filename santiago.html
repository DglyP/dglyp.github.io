<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/business_style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.halo.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        VANTA.HALO({
          el: "#vanta",
          mouseControls: true,
          touchControls: true,
          gyroControls: true,
          minHeight: 200.0,
          minWidth: 200.0,
          amplitudeFactor: 3.0,
          yOffset: -0.4,
          size: 2.0,
        });
      });

      function redirectToLink() {
        const number = document.getElementById("numberInput").value;
        if (number) {
          const baseUrl = "https://example.com/resource/";
          window.location.href = baseUrl + number;
        } else {
          alert("No habilitado aún");
        }
      }
    </script>
    <title>Santiago Corrales - Links</title>
  </head>
  <body>
    <div id="vanta"></div>
    <main>
      <header>
        <a href="https://www.linkedin.com/in/santiago-corrales-ux/">
          <img
            src="https://media.licdn.com/dms/image/D4E03AQHm96XDL7gqhw/profile-displayphoto-shrink_200_200/0/1692971367367?e=2147483647&v=beta&t=X4CJlDW0sysYF8pHhDzNGIS2Gxa9xZtHAtvK408ueSQ"
            alt="avatar logo"
          />
        </a>
        <h1>
          <a href="https://www.instagram.com/saintiago.life/"
            >Santiago Corrales</a
          >
        </h1>
      </header>
      <ul>
        <li>
          <div class="custom-button">
            <label for="numberInput">Inserta tu PhotoID:</label>
            <input
              type="number"
              id="numberInput"
              placeholder="Not available yet"
            />
            <button onclick="redirectToLink()">Click here</button>
          </div>
        </li>
        <a href="https://adobeaero.app.link/l7LwJ25p5Ib">
          <li>
            <img src="./images/ARExperience.svg" alt="AR experience" width="20" />
            AR Business Card Experience
          </li>
        </a>
        <a href="https://luciddreams.com.co">
          <li>
            <img src="./img/LucidLogo.png" alt="LucidLogo" width="20" />
            Lucid Dreams Website (work in progress)
          </li>
        </a>
        <a href="https://www.linkedin.com/in/santiago-corrales-ux/">
          <li>
            <img
              src="./images/linkedin.svg"
              alt="linkedin logo"
              width="20"
            />LinkedIn
          </li>
        </a>
        <a href="mailto:santiagoc@luciddreamsinteraction.com">
          <li>Envíame un E-mail</li>
        </a>
        <a href="tel:+573208032002">
          <li>Llámame</li>
        </a>
      </ul>
    </main>
  </body>
</html>
