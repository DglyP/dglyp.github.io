<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Code Compliant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="./css/codeCompliant.css" />
    <script src="codeCompliant.js"></script>
</head>
<body>


    <div id="wrapper">
        <div id="infoContainer">

            <div id="infoHeader">Midrise Apartment #1</div>

            <div id="imageContainer">
                <img src="./image/pict2.png" alt="house">
            </div>

            <div id="floorsContainer">
                <div id="floorsHeader">Number of floors</div>
                <div id="floorsContent"></div>
            </div>

            <div id="sizeContainer">
                <div id="sizeHeader">Size of units (ft²)</div>
                <div id="sizeContent"></div>
            </div>

            <div id="winwallContainer">
                <div id="winwallHeader">Window to Wall Ratio</div>
                <div id="winwallContent"></div>
            </div>

            <div id="roofContainer">
                <div id="roofHeader">Roof Type</div>
                <div id="roofContent"></div>
            </div>

            <div id="moreInfoContainer"></div>
        </div>

        <div id="codeContainer">
            
            <div id="codeHeader">Code Selection</div>
            
            <div id="locationContainer">
                <div id="locationHeader">Building Location (Affects code compliant)</div>
                <div id="locationContent"></div>
            </div>

            <div id="vContainer">
                <div id="hvacHeader">HVAC System</div>
                <div id="hvacContent"></div>
            </div>

            <div id="buildCodeContainer">
                <div id="buildCodeHeader">Building Code</div>
                <div id="buildCodeContent"></div>
            </div>
        </div>
    </div>
    
</body>
</html>
