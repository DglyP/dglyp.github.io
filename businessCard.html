<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/business_style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        VANTA.CLOUDS({
          el: "#vanta",
          mouseControls: true,
          touchControls: true,
          gyroControls: true,
          minHeight: 200.0,
          minWidth: 200.0,
          color: 0x882800 
        });
      });
    </script>
    <title>Degly Sebastian Pava - Links</title>
  </head>
  <body>
    <div id="vanta"></div>
    <main>
      <header>
        <a href="https://deglypava.com/projects.html">
          <img
            src="https://github.com/DglyP.png"
            alt="avatar logo"
          />
        </a>
        <h1>
          <a href="https://www.instagram.com/deglypava/"
            >@deglypava</a
          >
        </h1>
      </header>
      <ul>
        <a href="https://adobeaero.app.link/7rTXOeQJkGb">   
            <li>
              <img src="./images/ARExperience.svg" alt="AR experience" width="20" />
              AR Business Card Experience
            </li>
          </a>
        <a href="https://deglypava.com/projects.html">   
            <li>
              <img src="./images/deglylogo.svg" alt="dplogo" width="20" />
              My Website
            </li>
          </a>
        <a href="https://github.com/DglyP">
          <li>
            <img src="./images/github.svg" alt="github logo" width="20" />
            GitHub
          </li>
        </a>
        <a href="https://www.linkedin.com/in/deglypava/">
          <li>
            <img
              src="./images/linkedin.svg"
              alt="linkedin logo"
              width="20"
            />LinkedIn
          </li>
        </a>
        <a href="https://www.instagram.com/deglypava/">
          <li>
            <img
              src="./images/instagram.svg"
              alt="instagram logo"
              width="20"
            />Instagram
          </li>
        </a>
        <a href="https://www.twitter.com/deglypava/">
          <li>
            <img
              src="./images/twitter.svg"
              alt="twitter logo"
              width="20"
            />Twitter
          </li>
        </a>
        <a href="https://www.youtube.com/c/deglypava">
            <li>
              <img
                src="./images/youtube.svg"
                alt="youtube logo"
                width="20"
              />Youtube
            </li>
          </a>
      </ul>
    </main>
  </body>
</html>
