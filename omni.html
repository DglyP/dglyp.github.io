<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r124/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <title>Omni</title>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- vertexShader -->
  <script id="js-vertex-shader" type="x-shader/x-vertex">
  attribute vec3 position;
  
  void main()	{
    gl_Position = vec4(position, 1.0);
  }
  </script>
  
  <!-- fragmentShader -->
  <script id="js-fragment-shader" type="x-shader/x-fragment">
  precision highp float;
  uniform vec2 resolution;
  uniform float time;
  uniform float xScale;
  uniform float yScale;
  uniform float distortion;
  
  void main() {
    vec2 p = (gl_FragCoord.xy * 3.0 - resolution) / min(resolution.x, resolution.y);
    
    float d = length(p) * distortion;
    
    float rx = p.x * (1.0 + d);
    float gx = p.x;
    float bx = p.x * (1.0 - d);
  
    float r = 0.05 / abs(p.y + sin((rx + time) * xScale) * yScale);
    float g = 0.05 / abs(p.y + sin((gx + time) * xScale) * yScale);
    float b = 0.05 / abs(p.y + sin((bx + time) * xScale) * yScale);
    
    gl_FragColor = vec4(r, g, b, 1.0);
  }
  </script>
  <div class="container-fluid" style="position: relative; padding: 0;">
    <canvas id="webgl-canvas" style="position: absolute; z-index: 0;"></canvas>
    <script type="module" src="./js/omniLight.js"></script>
    <div class="col d-flex align-items-center justify-content-center" style="position: absolute; z-index: 2; height: 100vh; width: 100vw; justify-content: center; pointer-events: none;">
      <img src="images/omni..png" class="img-fluid" alt="omni-logo">
    </div>
    <p style="position: absolute; z-index: 1; color: white; font-size: 6px; font-family:'Courier New', Courier, monospace; margin-top: 98vh;">This is an adaptation of the amazing art by Web_yuki1027, find more at <a>https://codepen.io/Web_yuki1027/pen/yLgYpWM</a></p>
  </div>
</body>
</html>
