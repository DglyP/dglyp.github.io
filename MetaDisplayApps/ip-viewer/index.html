<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>IP Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Home Screen -->
    <div id="home" class="screen">
      <header class="header">
        <h1>IP Viewer</h1>
        <span class="header-meta" id="status-indicator">Ready</span>
      </header>
      
      <div class="content">
        <div class="card focusable" tabindex="0">
          <div class="card-subtitle">Local IP Address</div>
          <div class="card-value" id="local-ip">Detecting...</div>
        </div>

        <div class="card focusable" tabindex="0">
          <div class="card-subtitle">Public IP Address</div>
          <div class="card-value" id="public-ip">Detecting...</div>
        </div>

        <div id="loading" class="loading-container hidden">
          <div class="loading-spinner"></div>
          <div class="loading-text">Refreshing IP data...</div>
        </div>

        <div id="error" class="error-container hidden">
          <div class="error-icon">&#9888;</div>
          <div class="error-message">Failed to detect IP</div>
        </div>
      </div>

      <nav class="nav-bar">
        <button class="nav-item focusable primary" data-action="refresh">Refresh</button>
      </nav>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
