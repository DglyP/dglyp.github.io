<script type="module">

	// Prefer camera resolution nearest to 1280x720.
var constraints = { audio: true, video: { width: 1280, height: 720 } };

navigator.mediaDevices.getUserMedia(constraints)
.then(function(mediaStream) {
	
	alert("Let's get this party started")
  var video = document.querySelector('video');
  video.srcObject = mediaStream;
  video.onloadedmetadata = function(e) {
	  alert("HOOOOD")
    video.play();
  };
})
.catch(function(err) { console.log(err.name + ": " + err.message); }); // always check for errors at the end.

if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
  alert("Let's get this party started")
}

	const videoElement = document.getElementsByClassName('input_video')[0];
	const canvasElement = document.getElementsByClassName('output_canvas')[0];
	const canvasCtx = canvasElement.getContext('2d');
	
	function onResults(results) {
		canvasCtx.save();
		canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
		canvasCtx.drawImage(
			results.image, 0, 0, canvasElement.width, canvasElement.height);
		if (results.multiFaceLandmarks) {
		for (const landmarks of results.multiFaceLandmarks) {
			drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION,
							{color: '#C0C0C070', lineWidth: 1});
			drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF3030'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW, {color: '#FF3030'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_IRIS, {color: '#FF3030'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#30FF30'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW, {color: '#30FF30'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_IRIS, {color: '#30FF30'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#E0E0E0'});
			drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#E0E0E0'});
		}
		}
		canvasCtx.restore();
	}
	
	const faceMesh = new FaceMesh({locateFile: (file) => {
		return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
	}});
	faceMesh.setOptions({
		maxNumFaces: 1,
		refineLandmarks: true,
		minDetectionConfidence: 0.5,
		minTrackingConfidence: 0.5
	});
	faceMesh.onResults(onResults);
	
	const cameraFace = new Camera(videoElement, {
		onFrame: async () => {
		await faceMesh.send({image: videoElement});
		},
		width: 1280,
		height: 720
	});
	cameraFace.start();
	</script>

function webojiMain() {

	// WEBOJI START

	// Let's use weboji. See: https://handsfree.js.org/ref/model/weboji
	window.handsfreeWeb = new Handsfree({weboji: true})

	// Create a new "plugin" to hook into the main loop
	// @see https://handsfreeWeb.js.org/guide/the-loop
	handsfreeWeb.use('lookHandsfree', ({weboji}) => {
	if (!weboji?.degree?.[0]) return

	// Calculate rotation
	const rot = weboji.degree
	rot[0] -= 15

	// Calculate position
	const pos = {
		x: (weboji.translation[0] - .5) * 10,
		y: (weboji.translation[1] - .5) * 5,
		z: 5 - weboji.translation[2] * 30
	}

	// Tween this values
	TweenMax.to(tween, 1, {
		yaw: -rot[0] * 1.5,
		pitch: -rot[1] * 1.5,
		roll: rot[2] * 1.5,
		x: pos.x,
		y: pos.y,
		z: pos.z
	})
	// console.log(pos);
	// console.log(tween);

}
